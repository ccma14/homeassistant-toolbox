---
# yamllint configuration tailored for Home Assistant packages and blueprints
extends: default

rules:
  document-start: disable
  line-length:
    max: 220
    level: warning
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true

ignore: |
  .git/
  node_modules/
  */scratch/
  hpwh/scratch/
  hpwh/tests/mock_config/packages/
  hpwh/tests/mock_config/blueprints/
  hpwh/tests/mock_config/.storage/
  hpwh/tests/mock_config/www/
