blueprint:
  name: "Solar & Stratification Heat Pump Water Heater Manager"
  description: |
    Daily schedule and stratification manager for Heat Pump Water Heaters to handle tank stratification and maximize daytime solar self-consumption:

    * **Early Morning Assurance:** Checks the lower tank before morning showers. If depleted by evening usage, temporarily boosts the setpoint to reheat the lower tank buffer before shower time.
    * **Daytime Solar Boost:** Pre-heats the tank to the configured solar target (e.g. 140°F) on high solar forecast days to bank thermal energy, or maintains baseline (e.g. 125°F) on cloudy days.
    * **Evening Reset:** Drops setpoint to baseline (e.g. 120°F) to prevent the compressor from cycling overnight on home battery storage or grid power.
    * **Native Logging:** Automatically logs all setpoint changes and temperature triggers directly to Home Assistant's Logbook.
  domain: automation
  author: "ccma14"
  source_url: "https://raw.githubusercontent.com/ccma14/homeassistant-toolbox/main/hpwh/blueprint.yaml"
  homeassistant:
    min_version: "2024.10.0"
  input:
    water_heater:
      name: "Water Heater Climate Entity"
      description: "The climate entity controlling your heat pump water heater."
      selector:
        entity:
          domain: climate

    lower_tank_sensor:
      name: "Lower Tank Temperature Sensor"
      description: "Sensor reading the lower tank temperature (tracks cold water entering the bottom of the tank)."
      selector:
        entity:
          domain: sensor
          device_class: temperature

    upper_tank_sensor:
      name: "Upper Tank Temperature Sensor"
      description: "Sensor reading the upper tank temperature."
      selector:
        entity:
          domain: sensor
          device_class: temperature

    solar_forecast_sensor:
      name: "Solar Forecast Sensor"
      description: "Sensor providing today's solar PV forecast in kWh (e.g. Solcast, Forecast.Solar, or custom template)."
      selector:
        entity:
          domain: sensor

    solar_forecast_threshold:
      name: "Solar Forecast Threshold"
      description: "Forecast value in kWh above which the water heater is boosted to the solar target."
      default: 25
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "kWh"
          mode: box

    # --- Time Windows ---
    morning_boost_time:
      name: "Morning Assurance Time"
      description: "Time to check if the lower tank needs pre-shower recovery."
      default: "04:30:00"
      selector:
        time: {}

    solar_soak_time:
      name: "Daytime Solar Boost Time"
      description: "Time to engage the daytime solar heating boost."
      default: "10:00:00"
      selector:
        time: {}

    evening_reset_time:
      name: "Evening Reset Time"
      description: "Time to drop the setpoint back to baseline for the evening and night."
      default: "16:00:00"
      selector:
        time: {}

    # --- Temperature Thresholds ---
    morning_lower_threshold:
      name: "Depleted Lower Tank Threshold"
      description: "If lower tank is below this temperature at the morning check, recovery will trigger."
      default: 102
      selector:
        number:
          min: 70
          max: 120
          step: 1
          unit_of_measurement: "°F"
          mode: box

    morning_recovery_target:
      name: "Lower Tank Recovery Target"
      description: "Once the lower tank warms up to this temperature during morning recovery, it resets."
      default: 112
      selector:
        number:
          min: 90
          max: 130
          step: 1
          unit_of_measurement: "°F"
          mode: box

    solar_target_temperature:
      name: "Solar Boost Target Temperature"
      description: "Target temperature set on high-solar days."
      default: 140
      selector:
        number:
          min: 120
          max: 150
          step: 1
          unit_of_measurement: "°F"
          mode: box

    cloudy_target_temperature:
      name: "Cloudy Baseline Target Temperature"
      description: "Target temperature set during the daytime window on low-solar days."
      default: 125
      selector:
        number:
          min: 115
          max: 135
          step: 1
          unit_of_measurement: "°F"
          mode: box

    evening_target_temperature:
      name: "Evening Reset Target Temperature"
      description: "Target temperature set in the evening to prevent overnight cycling on home battery storage or grid power."
      default: 120
      selector:
        number:
          min: 110
          max: 130
          step: 1
          unit_of_measurement: "°F"
          mode: box

# Map inputs into Jinja template variables for clean reuse
variables:
  v_heater: !input water_heater
  v_lower_sensor: !input lower_tank_sensor
  v_upper_sensor: !input upper_tank_sensor
  v_solar_sensor: !input solar_forecast_sensor
  v_solar_thresh: !input solar_forecast_threshold
  v_morning_thresh: !input morning_lower_threshold
  v_recovery_thresh: !input morning_recovery_target
  v_solar_temp: !input solar_target_temperature
  v_cloudy_temp: !input cloudy_target_temperature
  v_evening_temp: !input evening_target_temperature
  v_morning_time: !input morning_boost_time
  v_solar_time: !input solar_soak_time
  v_evening_time: !input evening_reset_time

triggers:
  - trigger: time
    at: !input morning_boost_time
    id: morning_boost

  - trigger: time
    at: !input solar_soak_time
    id: solar_soak

  - trigger: time
    at: !input evening_reset_time
    id: evening_reset

  - trigger: homeassistant
    event: start
    id: ha_restart

  - trigger: event
    event_type: automation_reloaded
    id: ha_restart

actions:
  - choose:
      # =========================================================================
      # Stage 1: Morning Assurance
      # =========================================================================
      - conditions:
          - condition: or
            conditions:
              # Scheduled morning check: trigger if lower tank is below threshold
              - condition: and
                conditions:
                  - condition: trigger
                    id: morning_boost
                  - condition: template
                    value_template: >-
                      {{ has_value(v_lower_sensor) and has_value(v_upper_sensor) and (states(v_lower_sensor) | float) < (v_morning_thresh | float) }}
              # Startup/reload during morning window: resume recovery if overdrive is active
              - condition: and
                conditions:
                  - condition: trigger
                    id: ha_restart
                  - condition: template
                    value_template: >-
                      {% set is_morning_window = today_at(v_morning_time) <= now() < today_at(v_solar_time) %}
                      {% set cur_target = state_attr(v_heater, 'temperature') %}
                      {{ is_morning_window and has_value(v_heater) and cur_target is not none and (cur_target | float) > (v_evening_temp | float) }}
        sequence:
          # If scheduled morning boost, compute and apply overdrive target
          - if:
              - condition: trigger
                id: morning_boost
            then:
              # Compute overdrive target (upper + 4°F bounded by cloudy and solar targets)
              - variables:
                  target_temp: >-
                    {% set upper = states(v_upper_sensor) | float(v_evening_temp) %}
                    {% set max_temp = v_solar_temp | float(140) %}
                    {% set min_temp = v_cloudy_temp | float(125) %}
                    {{ [ [ (upper + 4) | round(0), min_temp ] | max, max_temp ] | min }}

              - action: climate.set_temperature
                target:
                  entity_id: !input water_heater
                data:
                  temperature: "{{ target_temp }}"

              - action: logbook.log
                data:
                  name: "HPWH Manager"
                  message: "Morning Boost: Set to {{ target_temp | int }}°F (Lower: {{ states(v_lower_sensor) | int ~ '°F' if is_number(states(v_lower_sensor)) else 'N/A' }})"
                  entity_id: !input water_heater

          # Wait until lower tank recovers (evaluates immediately if already recovered)
          - wait_template: >-
              {{ states(v_lower_sensor) | float(0) >= (v_recovery_thresh | float) }}
            timeout: "02:00:00"
            continue_on_timeout: true

          - action: climate.set_temperature
            target:
              entity_id: !input water_heater
            data:
              temperature: !input evening_target_temperature

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: "HPWH Manager"
                      message: "Morning Reset: {{ v_evening_temp | int }}°F (Lower recovered to {{ states(v_lower_sensor) | int ~ '°F' if is_number(states(v_lower_sensor)) else 'N/A' }})"
                      entity_id: !input water_heater
            default:
              - action: logbook.log
                data:
                  name: "HPWH Manager"
                  message: "Morning Timeout: Reset to {{ v_evening_temp | int }}°F (Timed out after 2 hr, lower: {{ states(v_lower_sensor) | int ~ '°F' if is_number(states(v_lower_sensor)) else 'N/A' }})"
                  entity_id: !input water_heater

      # =========================================================================
      # Stage 2: Daytime Solar Boost / Baseline
      # =========================================================================
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: solar_soak
              # Startup/reload during daytime window: apply daytime target if currently below baseline
              - condition: and
                conditions:
                  - condition: trigger
                    id: ha_restart
                  - condition: template
                    value_template: >-
                      {% set is_daytime_window = today_at(v_solar_time) <= now() < today_at(v_evening_time) %}
                      {% set cur_target = state_attr(v_heater, 'temperature') %}
                      {{ is_daytime_window and has_value(v_heater) and cur_target is not none and (cur_target | float) < (v_cloudy_temp | float) }}
        sequence:
          - choose:
              # High solar forecast
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ states(v_solar_sensor) | float(0) > (v_solar_thresh | float) }}
                sequence:
                  - action: climate.set_temperature
                    target:
                      entity_id: !input water_heater
                    data:
                      temperature: !input solar_target_temperature
                  - action: logbook.log
                    data:
                      name: "HPWH Manager"
                      message: "Solar Boost: {{ v_solar_temp | int }}°F (Forecast: {{ ('%.1f' | format(states(v_solar_sensor) | float)) ~ ' kWh' if is_number(states(v_solar_sensor)) else 'N/A' }})"
                      entity_id: !input water_heater

            # Low solar forecast
            default:
              - action: climate.set_temperature
                target:
                  entity_id: !input water_heater
                data:
                  temperature: !input cloudy_target_temperature
              - action: logbook.log
                data:
                  name: "HPWH Manager"
                  message: "Cloudy Baseline: {{ v_cloudy_temp | int }}°F (Forecast: {{ ('%.1f' | format(states(v_solar_sensor) | float)) ~ ' kWh' if is_number(states(v_solar_sensor)) else 'N/A' }})"
                  entity_id: !input water_heater

      # =========================================================================
      # Stage 3: Evening Reset
      # =========================================================================
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: evening_reset
              # Startup/reload during overnight window: ensure reset to baseline if target is high
              - condition: and
                conditions:
                  - condition: trigger
                    id: ha_restart
                  - condition: template
                    value_template: >-
                      {% set is_overnight = now() < today_at(v_morning_time) or now() >= today_at(v_evening_time) %}
                      {% set cur_target = state_attr(v_heater, 'temperature') %}
                      {{ is_overnight and has_value(v_heater) and cur_target is not none and (cur_target | float) > (v_evening_temp | float) }}
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: !input water_heater
            data:
              temperature: !input evening_target_temperature
          - action: logbook.log
            data:
              name: "HPWH Manager"
              message: "Evening Reset: Set to {{ v_evening_temp | int }}°F"
              entity_id: !input water_heater

mode: restart
