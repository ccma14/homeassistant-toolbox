name: Test & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-analysis:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint hpwh/**/*.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yaml .

      - name: Run component card tests (hpwh)
        run: node hpwh/tests/test_card.js

      - name: Run component template tests (hpwh)
        run: python3 hpwh/tests/test_templates.py

  ha-validation:
    name: Home Assistant Config & Blueprint Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare mock config
        run: |
          mkdir -p hpwh/tests/mock_config/packages hpwh/tests/mock_config/blueprints/automation/hpwh
          cp hpwh/hpwh.yaml hpwh/tests/mock_config/packages/hpwh.yaml
          cp hpwh/blueprint.yaml hpwh/tests/mock_config/blueprints/automation/hpwh/blueprint.yaml

      - name: Home Assistant Core check_config
        uses: frenck/action-home-assistant@v1.4.1
        with:
          path: hpwh/tests/mock_config
